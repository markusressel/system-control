redshift:
  brightness:
    minimumBrightness: 0.1
    maximumBrightness: 1.0
  transitionDuration: 2s
daemon:
  # How often watched state is re-queried (--watch), in addition to change notifications.
  pollIntervals:
    # changes made with system-control are pushed to the daemon immediately,
    # polling only picks up changes made by other means
    display: 5s
    # audio is driven by PipeWire events, set an interval only as a safety net
    # audio: 30s
    # backlights are changed by hardware keys without any event (default 2s)
    # backlight: 2s
    # keyboard: 2s
    # fan mode can only be polled
    fan: 5s

hotspot:
  # all optional: the first WiFi device, the hostname and a password generated by NetworkManager are used
  # interface: wlan0
  # ssid: MyHotspot
  # password: secret123
fan:
  # sysfs file(s) holding the fan mode, defaults to the ASUS WMI throttle_thermal_policy
  # policyFileGlob: /sys/devices/platform/asus-nb-wmi/hwmon/*/device/throttle_thermal_policy
